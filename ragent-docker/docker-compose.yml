version: '3.8'

services:
  # 1. PostgreSQL + pgvector
  postgres:
    image: ankane/pgvector:latest
    container_name: ragent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: ragent
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - ./volumes/postgres/data:/var/lib/postgresql/data
    networks:
      - ragent-network

  # 2. Redis（用你本地的 6-alpine 或重新拉 7-alpine）
  redis:
    image: redis:6-alpine
    container_name: ragent-redis
    restart: unless-stopped
    command: redis-server --requirepass 123456 --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - ./volumes/redis/data:/data
    networks:
      - ragent-network

  # 3. MinIO (RustFS)
  rustfs:
    image: minio/minio:RELEASE.2024-03-03T17-50-39Z
    container_name: ragent-rustfs
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: rustfsadmin
      MINIO_ROOT_PASSWORD: rustfsadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./volumes/rustfs/data:/data
    command: server /data --console-address ":9001"
    networks:
      - ragent-network

networks:
  ragent-network:
    driver: bridge